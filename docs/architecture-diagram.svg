<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">StrydeGoSox system architecture</title>
  <desc id="desc">Architecture diagram showing the shopper storefront and admin console connecting to a Node and Express API, security middleware, application modules, MongoDB, Razorpay and Resend.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb2cc" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1421"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45c9f5"/>
      <stop offset="1" stop-color="#637dff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#4c9cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02060c" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#65bde9"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a99cff"/>
    </marker>
    <style>
      .eyebrow{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#8ca8c7}
      .heading{font:700 30px Arial,sans-serif;fill:#f2f7ff}
      .sub{font:14px Arial,sans-serif;fill:#a9bdd4}
      .section{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#78bce6}
      .cardtitle{font:700 17px Arial,sans-serif;fill:#f2f7ff}
      .body{font:13px Arial,sans-serif;fill:#b6c7dc}
      .tiny{font:11px Arial,sans-serif;fill:#8fa8c2}
      .module{font:700 13px Arial,sans-serif;fill:#e9f2ff}
      .muted{fill:#819ab4}
      .line{fill:none;stroke:#65bde9;stroke-width:2.5;marker-end:url(#arrow)}
      .line2{fill:none;stroke:#a99cff;stroke-width:2.3;marker-end:url(#arrowViolet)}
      .dash{stroke-dasharray:7 7}
    </style>
  </defs>

  <rect width="1440" height="850" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="850" rx="28" fill="url(#grid)"/>
  <rect x="48" y="48" width="5" height="91" rx="2.5" fill="url(#blue)"/>
  <text x="76" y="68" class="eyebrow">STRYDEGOSOX / SYSTEM OVERVIEW</text>
  <text x="76" y="111" class="heading">One commerce workflow. Four connected layers.</text>
  <text x="76" y="139" class="sub">A clear boundary between customer interfaces, trusted application logic, persistent data and external services.</text>

  <!-- Connectors behind the cards -->
  <path d="M350 305 C385 305 393 330 428 330" class="line"/>
  <path d="M350 480 C390 480 392 470 428 470" class="line"/>
  <path d="M1000 330 C1032 330 1035 282 1070 282" class="line"/>
  <path d="M1000 492 C1035 492 1035 532 1070 532" class="line"/>
  <path d="M1070 610 C1038 610 1030 565 1000 565" class="line2 dash"/>
  <text x="1017" y="634" class="tiny" fill="#b9adff">signed webhook</text>

  <!-- Browser layer -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="280" height="450" rx="20" fill="#142338" stroke="#2d4662"/>
    <rect x="70" y="190" width="280" height="54" rx="20" fill="#1b3048"/>
    <path d="M70 224V244H350V224" fill="#1b3048"/>
  </g>
  <text x="94" y="222" class="section">01 / EXPERIENCE</text>
  <rect x="94" y="276" width="232" height="132" rx="14" fill="#192d43" stroke="#345471"/>
  <circle cx="116" cy="300" r="5" fill="#54c6f3"/>
  <text x="132" y="305" class="cardtitle">Customer storefront</text>
  <text x="116" y="337" class="body">Product discovery</text>
  <text x="116" y="359" class="body">Options · Cart · Checkout</text>
  <text x="116" y="381" class="tiny">Responsive customer experience</text>

  <rect x="94" y="434" width="232" height="156" rx="14" fill="#192d43" stroke="#4b4e83"/>
  <circle cx="116" cy="458" r="5" fill="#a99cff"/>
  <text x="132" y="463" class="cardtitle">Admin console</text>
  <text x="116" y="495" class="body">Catalogue and inventory</text>
  <text x="116" y="517" class="body">Orders · Fulfilment</text>
  <text x="116" y="539" class="body">COD · Refund operations</text>
  <text x="116" y="563" class="tiny">Authenticated staff workflows</text>
  <text x="94" y="615" class="tiny">Browser inputs are never the source of truth.</text>

  <!-- Application layer -->
  <g filter="url(#shadow)">
    <rect x="428" y="190" width="572" height="450" rx="20" fill="#142338" stroke="#3b5d7b"/>
    <rect x="428" y="190" width="572" height="54" rx="20" fill="#1a3049"/>
    <path d="M428 224V244H1000V224" fill="#1a3049"/>
  </g>
  <text x="454" y="222" class="section">02 / APPLICATION</text>
  <rect x="454" y="270" width="520" height="70" rx="12" fill="#1a3954" stroke="#4383ad"/>
  <text x="478" y="299" class="cardtitle">Node.js + Express API</text>
  <text x="478" y="322" class="body">Request routing · Business rules · Provider orchestration</text>
  <rect x="454" y="356" width="520" height="48" rx="10" fill="#202b43" stroke="#625d9e"/>
  <text x="478" y="385" class="module">Security middleware</text>
  <text x="690" y="385" class="tiny">Helmet / CSP · CORS · rate limits · auth</text>

  <text x="454" y="436" class="section">CORE MODULES</text>
  <rect x="454" y="452" width="246" height="56" rx="10" fill="#1b2d44" stroke="#344f6d"/>
  <rect x="714" y="452" width="260" height="56" rx="10" fill="#1b2d44" stroke="#344f6d"/>
  <rect x="454" y="520" width="246" height="56" rx="10" fill="#1b2d44" stroke="#344f6d"/>
  <rect x="714" y="520" width="260" height="56" rx="10" fill="#1b2d44" stroke="#344f6d"/>
  <text x="475" y="486" class="module">Authentication</text>
  <text x="735" y="486" class="module">Checkout + pricing</text>
  <text x="475" y="554" class="module">Payments + webhooks</text>
  <text x="735" y="554" class="module">Admin + order operations</text>
  <text x="454" y="613" class="tiny">Shared order and inventory services coordinate state changes.</text>

  <!-- Data layer -->
  <g filter="url(#shadow)">
    <rect x="1070" y="190" width="300" height="200" rx="20" fill="#142338" stroke="#386d7b"/>
  </g>
  <text x="1095" y="222" class="section">03 / PERSISTENCE</text>
  <text x="1095" y="269" class="cardtitle">MongoDB</text>
  <text x="1095" y="296" class="body">Users · Products</text>
  <text x="1095" y="319" class="body">Orders · Store settings</text>
  <text x="1095" y="342" class="body">Webhook event records</text>
  <text x="1095" y="370" class="tiny">Mongoose models and indexed state</text>

  <!-- Integrations -->
  <g filter="url(#shadow)">
    <rect x="1070" y="425" width="300" height="215" rx="20" fill="#142338" stroke="#5c548a"/>
  </g>
  <text x="1095" y="458" class="section">04 / INTEGRATIONS</text>
  <rect x="1095" y="480" width="250" height="65" rx="12" fill="#1b2d45" stroke="#4a6385"/>
  <circle cx="1120" cy="512" r="7" fill="#8a7dff"/>
  <text x="1140" y="507" class="cardtitle">Razorpay</text>
  <text x="1140" y="528" class="tiny">Payment orders · Signed events</text>
  <rect x="1095" y="560" width="250" height="55" rx="12" fill="#1b2d45" stroke="#4a6385"/>
  <circle cx="1120" cy="587" r="7" fill="#55c4a6"/>
  <text x="1140" y="592" class="cardtitle">Resend</text>
  <text x="1095" y="629" class="tiny">Transactional order and status emails</text>

  <!-- Trust layer -->
  <rect x="70" y="690" width="1300" height="110" rx="18" fill="#111e30" stroke="#2b405b"/>
  <text x="96" y="724" class="section">TRANSACTION CONTROLS</text>
  <rect x="96" y="742" width="365" height="38" rx="9" fill="#1a3248"/>
  <rect x="480" y="742" width="390" height="38" rx="9" fill="#1c2c48"/>
  <rect x="889" y="742" width="455" height="38" rx="9" fill="#1c3040"/>
  <text x="114" y="766" class="body">Server-side price calculation</text>
  <text x="498" y="766" class="body">Payment verification + idempotency</text>
  <text x="907" y="766" class="body">Inventory reserve · commit · release</text>
</svg>